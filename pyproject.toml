[project]
name = "llob"
version = "1.0.0"
description = "Locally Linear Order Book model simulations for market microstructure research"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matthieu Blanke" },
    { name = "Jose Moran" },
]
dependencies = [
    "fbm>=0.3.0",
    "matplotlib>=3.5.0",
    "numba>=0.56.0",
    "numpy>=1.21.0",
    "retry>=0.9.2",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "sphinx>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP045"]  # E501: Line too long; UP045: Prefer Optional[X] over X | None

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
